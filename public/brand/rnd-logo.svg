<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="logoLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Round Background -->
  <circle cx="64" cy="64" r="62" fill="url(#logoBg)" stroke="#6366f1" stroke-width="3" />

  <!-- Flask Illustration -->
  <g transform="translate(64, 52)">
    <!-- Flask Outline -->
    <path d="M-6 -22 L6 -22 M-3 -22 L-3 -12 L-17 12 C-19 15 -17 19 -13 19 L13 19 C17 19 19 15 17 12 L3 -12 L3 -22" 
          fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Liquid -->
    <path d="M-10 1 C-5 3 5 -1 10 1 L15 10 C16 13 14 16 11 16 L-11 16 C-14 16 -16 13 -15 10 Z" 
          fill="url(#logoLiquid)" opacity="0.9" />
    <!-- Sparkle -->
    <path d="M18 -14 Q18 -9 23 -9 Q18 -9 18 -4 Q18 -9 13 -9 Q18 -9 18 -14 Z" fill="url(#sparkleGrad)" transform="scale(0.8)" />
  </g>

  <!-- Clean R&D text at bottom -->
  <text x="64" y="104" text-anchor="middle" fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5">
    R&amp;D
  </text>
</svg>
