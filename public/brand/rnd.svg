<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="500" height="580">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Badge Radial Glow -->
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <!-- Flask Fluid Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Pattern Motif -->
    <pattern id="labPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M15 10 L25 10 M20 10 L20 18 L12 30 A 2 2 0 0 0 14 34 L26 34 A 2 2 0 0 0 28 30 L20 18" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />
      <circle cx="45" cy="20" r="3" fill="#ffffff" fill-opacity="0.04" />
      <path d="M40 45 L50 45 M45 40 L45 50" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
      <circle cx="20" cy="50" r="2" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="500" height="580" rx="36" fill="url(#bgGrad)" />
  <rect width="500" height="580" rx="36" fill="url(#labPattern)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="250" cy="220" r="180" fill="url(#badgeGlow)" />

  <!-- Central Crest Circle -->
  <circle cx="250" cy="200" r="100" fill="#0f172a" fill-opacity="0.6" stroke="#4f46e5" stroke-width="3" />
  <circle cx="250" cy="200" r="92" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />

  <!-- Innovation / Lab Flask & Sparkle Illustration -->
  <g transform="translate(250, 195)">
    <!-- Flask Neck & Body -->
    <path d="M-12 -55 L12 -55 M-7 -55 L-7 -30 L-38 25 C-42 32 -37 40 -28 40 L28 40 C37 40 42 32 38 25 L7 -30 L7 -55" 
          fill="none" stroke="#e0e7ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Flask Liquid -->
    <path d="M-22 0 C-10 6 10 -4 22 0 L33 22 C36 28 32 34 25 34 L-25 34 C-32 34 -36 28 -33 22 Z" 
          fill="url(#liquidGrad)" opacity="0.9" />
    <!-- Bubbles -->
    <circle cx="-6" cy="18" r="3.5" fill="#ffffff" opacity="0.8" />
    <circle cx="10" cy="12" r="2.5" fill="#ffffff" opacity="0.7" />
    <circle cx="4" cy="24" r="2" fill="#ffffff" opacity="0.9" />

    <!-- Sparkles / Ideas -->
    <path d="M-45 -25 Q-45 -12 -32 -12 Q-45 -12 -45 1 Q-45 -12 -58 -12 Q-45 -12 -45 -25 Z" fill="url(#goldGrad)" />
    <path d="M42 -35 Q42 -27 50 -27 Q42 -27 42 -19 Q42 -27 34 -27 Q42 -27 42 -35 Z" fill="url(#goldGrad)" transform="scale(0.8)" />
    <circle cx="35" cy="-8" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="250" y="360" text-anchor="middle" fill="#ffffff" 
        font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="4">
    R&amp;D
  </text>

  <!-- Subtitle -->
  <text x="250" y="398" text-anchor="middle" fill="#c7d2fe" 
        font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="3.5">
    RESEARCH &amp; DEVELOPMENT
  </text>

  <!-- Pill Badge -->
  <g transform="translate(250, 442)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#a5b4fc" 
          font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2">
      TEST KITCHEN &amp; LAB
    </text>
  </g>

  <!-- Subtle bottom decorative note -->
  <text x="250" y="525" text-anchor="middle" fill="#6366f1" fill-opacity="0.8"
        font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
    PIZZA MANIA &amp; LE LAPIN
  </text>
</svg>
