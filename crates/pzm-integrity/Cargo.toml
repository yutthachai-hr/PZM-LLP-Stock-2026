[package]
name = "pzm-integrity"
version = "0.1.0"
edition = "2021"
description = "PZM stock integrity invariants (G13). Pure library + CLI; mirrors src/agent/integrityReference.ts."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pzm-integrity"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
