# Netlify build config — lets Netlify build straight from the GitHub repo, so pushing to
# main deploys the site. (Before this, dist/ was built locally and drag-dropped by hand.)
#
# SPA routing is handled by public/_redirects, which Vite copies into dist/ — deliberately
# not repeated here, so there is only one place to change it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify defaults to an older Node than this project builds with locally. Vite 8 needs
  # 20.19+/22.12+; 22 is the current LTS.
  NODE_VERSION = "22"

# The app is a PWA: the service worker and the HTML that boots it must never be served from
# cache, or a deploy keeps showing the previous build until the SW happens to update.
# Everything under /assets/ is content-hashed by Vite, so it is safe to cache forever.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------- security ----
#
# The branches share a tablet, so the answer to "is this a trusted device" is no. These
# headers are the part of that a static host can enforce; the rest (idle sign-out, clearing
# the offline copy on logout) lives in the app.
#
# Kept deliberately tight and explicit rather than copied from a template: every origin
# below is one this app actually talks to, and anything not listed is refused. If a feature
# ever needs a new host, it belongs here with a reason.

[[headers]]
  for = "/*"
  [headers.values]
    # Nobody frames this app. Stock levels and supplier invoice numbers are not
    # decoration for someone else's page, and framing is how clickjacking starts.
    X-Frame-Options = "DENY"
    # Do not leak which branch or product someone was looking at to third-party sites.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Stop the browser guessing a type for a response and running it as script.
    X-Content-Type-Options = "nosniff"
    # This app has no use for any of these; a compromised dependency should not either.
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = '''default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests'''
