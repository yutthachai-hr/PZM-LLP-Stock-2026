# Netlify build config — lets Netlify build straight from the GitHub repo, so pushing to
# main deploys the site. (Before this, dist/ was built locally and drag-dropped by hand.)
#
# SPA routing is handled by public/_redirects, which Vite copies into dist/ — deliberately
# not repeated here, so there is only one place to change it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify defaults to an older Node than this project builds with locally. Vite 8 needs
  # 20.19+/22.12+; 22 is the current LTS.
  NODE_VERSION = "22"

# The app is a PWA: the service worker and the HTML that boots it must never be served from
# cache, or a deploy keeps showing the previous build until the SW happens to update.
# Everything under /assets/ is content-hashed by Vite, so it is safe to cache forever.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
