# Netlify build config — lets Netlify build straight from the GitHub repo, so pushing to
# main deploys the site. (Before this, dist/ was built locally and drag-dropped by hand.)
#
# SPA routing is handled by public/_redirects, which Vite copies into dist/ — deliberately
# not repeated here, so there is only one place to change it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify defaults to an older Node than this project builds with locally. Vite 8 needs
  # 20.19+/22.12+; 22 is the current LTS.
  NODE_VERSION = "22"

  # Netlify's secret scanner flags src/firebase/config.ts's apiKey as a likely leaked
  # secret because it starts with "AIza" — it is a Firebase WEB API key, which Google
  # documents as safe to ship in client code: it names a project, it does not grant
  # access. Access is gated by firestore.rules and by Firebase's authorized-domains list,
  # not by hiding this string. Omitting it from the scan (rather than disabling scanning
  # outright) keeps the check live for anything that would be a real leak — a service
  # account key, an admin token — while not failing every build on a false positive.
  SECRETS_SCAN_OMIT_PATHS = "src/firebase/config.ts,dist/**"

# The app is a PWA: the service worker and the HTML that boots it must never be served from
# cache, or a deploy keeps showing the previous build until the SW happens to update.
# Everything under /assets/ is content-hashed by Vite, so it is safe to cache forever.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------- security ----
#
# The branches share a tablet, so the answer to "is this a trusted device" is no. These
# headers are the part of that a static host can enforce; the rest (idle sign-out, clearing
# the offline copy on logout) lives in the app.
#
# Kept deliberately tight and explicit rather than copied from a template: every origin
# below is one this app actually talks to, and anything not listed is refused. If a feature
# ever needs a new host, it belongs here with a reason.

[[headers]]
  for = "/*"
  [headers.values]
    # Nobody frames this app. Stock levels and supplier invoice numbers are not
    # decoration for someone else's page, and framing is how clickjacking starts.
    X-Frame-Options = "DENY"
    # Do not leak which branch or product someone was looking at to third-party sites.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Stop the browser guessing a type for a response and running it as script.
    X-Content-Type-Options = "nosniff"
    # This app has no use for any of these; a compromised dependency should not either.
    Permissions-Policy = "geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    # LINE: the LIFF SDK is bundled from npm, but at init it still loads its "client
    # features" script from static.line-scdn.net and its wording from liffsdk.line-scdn.net
    # (seen blocked on the first demo run: "failed to load legacy extensions" — and with
    # them the share target picker reported itself unavailable). Sharing from an ordinary
    # browser opens LINE's own picker in a popup/frame on liff.line.me / access.line.me.
    # Nothing else of LINE's is reachable.
    Content-Security-Policy = '''default-src 'self'; script-src 'self' https://static.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://profile.line-scdn.net https://static.line-scdn.net; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com https://api.line.me https://liff.line.me https://access.line.me https://static.line-scdn.net https://liffsdk.line-scdn.net; frame-src https://liff.line.me https://access.line.me https://static.line-scdn.net; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://access.line.me; frame-ancestors 'none'; upgrade-insecure-requests'''

# ---------------------------------------------------------------- functions ----
#
# netlify/functions/po-image.mts hosts order-sheet pictures for LINE to fetch (see the
# file). It needs Netlify Blobs, which is part of the site; nothing to configure here
# beyond the bundler.
[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------- production ----
#
# The LIFF app the live site sends order sheets through (owner, 15 Sep 2026). A LIFF id
# is public — it ships in the client bundle — which is why it can live here. A LIFF app
# has exactly one Endpoint URL, and this one's must be https://pzmstock.netlify.app.
[context.production.environment]
  VITE_LIFF_ID = "2011602857-k9K8Zplx"

# ---------------------------------------------------------------- demo branch ----
#
# A branch named `demo` deploys the demo build: browser storage only, never the live
# Firebase project (see .env.demo). It exists so the LINE share — which needs a real HTTPS
# address to run — can be tried without touching production. Enable "branch deploys" for
# `demo` in the Netlify UI.
#
# VITE_LIFF_ID is the LIFF app whose Endpoint URL is the demo deploy (the owner created it
# on 14 Sep 2026). A LIFF id is public — it ships in client code — so it lives here.
# Production gets its own LIFF app (endpoint = the live URL), set as VITE_LIFF_ID on the
# production context in the Netlify UI, never in this file.
#
# PO_IMAGE_DEMO_KEY / VITE_PO_IMAGE_DEMO_KEY (the same random string) are set in the
# Netlify UI for this context only — a key does not belong in the repo.
[context.demo.environment]
  VITE_DEMO_MODE = "1"
  VITE_LIFF_ID = "2011602857-k9K8Zplx"
