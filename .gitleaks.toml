# gitleaks (CI job `secrets`): the default rules, plus two test files whose "service account"
# is a fake fixture (private_key "-----BEGIN PRIVATE KEY-----\nAA==\n…", project "demo").
# Only these exact files; any other match anywhere still fails the job.
[extend]
useDefault = true

[allowlist]
description = "fake service-account fixtures used by the server tests"
paths = [
  '''^tests/functions/stock-env\.test\.ts$''',
  '''^tests/worker/worker\.test\.ts$''',
]

# Model-file checksums on exp/real-stack (owner, 9 Oct 2026). stack/pins.json and
# stack/evidence/ask-bench.json pin the AI stack's model files by SHA-256 (64 hex) and git-blob
# SHA-1 (40 hex); keys like "tokenizer/tokenizer.json" make the default generic-api-key rule
# read a checksum as a token. Suppressed only when ALL hold: that one rule, those two files, and
# a value that is nothing but 40 or 64 lowercase hex. Any other value, file or rule still fails.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "SHA-256 / git-blob SHA-1 model-file checksums in the AI stack pin files"
  condition = "AND"
  paths = [
    '''^stack/pins\.json$''',
    '''^stack/evidence/ask-bench\.json$''',
  ]
  regexTarget = "secret"
  regexes = [
    '''^[0-9a-f]{40}$''',
    '''^[0-9a-f]{64}$''',
  ]
